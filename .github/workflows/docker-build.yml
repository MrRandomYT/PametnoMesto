name: Build and Push Docker Image v2

on:
  push:
    branches:
      - main
      - Development

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: '8.0'

      - name: Restore .NET packages
        run: dotnet restore

      - name: Build .NET project
        run: dotnet build --configuration Release

      - name: Run tests
        run: dotnet test --no-restore --logger:trx --results-directory ./TestResults

      - name: Save test results as artifact
        uses: dorny/test-reporter@v1
        with:
          name: 'Test Results'
          path: ${{ github.workspace }}/TestResults/*.trx
          reporter: 'dotnet-trx'

      - name: Publish .NET project
        run: dotnet publish --configuration Release --no-build --output "${{ github.workspace }}/publish"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: mrrandomyt/pametno-mesto:dev
