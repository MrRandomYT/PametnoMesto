name: Build and Push Docker Image v2

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
        
      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Build and push Docker image
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: mrrandomyt/pametno-mesto:latest

      - name: Restore .NET packages
        run: dotnet restore ./PametnoMesto/PametnoMesto.csproj

      - name: Build .NET project
        run: dotnet build ./PametnoMesto/PametnoMesto.csproj --configuration Release

      - name: Publish
        run: dotnet publish ./PametnoMesto/PametnoMesto.csproj --configuration Release --no-build --output "${{ github.workspace }}/publish"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app.name: "RGIS-PM"
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: "${{ github.workspace }}/publish"